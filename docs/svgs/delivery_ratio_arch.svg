<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 600" role="img">
<title>Delivery Ratio — how it works</title>
<defs>
<filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.09"/></filter>
<marker id="ma" markerWidth="12" markerHeight="12" refX="7" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#94A3B8"/></marker>
</defs>
<style>
text{font-family:Inter,'Segoe UI',Helvetica,Arial,sans-serif}
.tt{font-size:28px;font-weight:800;fill:#0F172A}.sub{font-size:14.5px;fill:#64748B}
.st{font-size:15px;font-weight:800;fill:#0F172A}.p{font-size:12px;fill:#475569}
.badge{font-size:14px;font-weight:800;fill:#FFFFFF}
.mono{font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;font-size:11.5px;fill:#0F172A}
.monos{font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;font-size:11px;fill:#64748B}
.big{font-size:30px;font-weight:800}
.ico{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
</style>
<rect x="0" y="0" width="1440" height="600" fill="#EEF2F7"/>
<rect x="24" y="24" width="1392" height="552" rx="20" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="56" y="66" class="tt">Delivery Ratio — how it works</text>
<text x="56" y="92" class="sub">One STATUS cycle, 3 neighbors online. Follow it left → right; in this example node <tspan font-weight="700" fill="#DC2626">N3's ACK is lost</tspan>.</text>

<!-- connectors between steps -->
<line x1="296" y1="330" x2="326" y2="330" stroke="#94A3B8" stroke-width="2" marker-end="url(#ma)"/>
<line x1="590" y1="330" x2="620" y2="330" stroke="#94A3B8" stroke-width="2" marker-end="url(#ma)"/>
<line x1="884" y1="330" x2="914" y2="330" stroke="#94A3B8" stroke-width="2" marker-end="url(#ma)"/>
<line x1="1178" y1="330" x2="1208" y2="330" stroke="#94A3B8" stroke-width="2" marker-end="url(#ma)"/>

<!-- ============ STEP 1 · SEND ============ -->
<g filter="url(#sh)"><rect x="56" y="120" width="240" height="420" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="2"/></g>
<circle cx="82" cy="148" r="13" fill="#059669"/><text x="82" y="153" text-anchor="middle" class="badge">1</text>
<text x="104" y="153" class="st" fill="#065F46">SEND</text>
<text x="76" y="184" class="p">status_task broadcasts one</text>
<text x="76" y="201" class="p">STATUS, stamped with the</text>
<text x="76" y="218" class="p">current time.</text>
<rect x="76" y="236" width="200" height="30" rx="6" fill="#DCFCE7" stroke="#059669" stroke-width="1.2"/>
<text x="176" y="256" text-anchor="middle" class="mono" fill="#065F46">STATUS { ts = 18420 }</text>
<!-- sender + 3 nodes -->
<g transform="translate(150,300)" stroke="#059669" class="ico"><path d="M0,14 a14,14 0 0 1 24,0"/><path d="M5,19 a8,8 0 0 1 14,0"/><circle cx="12" cy="24" r="2" fill="#059669" stroke="none"/></g>
<text x="176" y="356" text-anchor="middle" class="monos">broadcast to all neighbors</text>
<text x="96" y="392" class="mono" fill="#065F46">→ N1</text>
<text x="96" y="416" class="mono" fill="#065F46">→ N2</text>
<text x="96" y="440" class="mono" fill="#065F46">→ N3</text>
<circle cx="150" cy="388" r="6" fill="#059669"/><circle cx="150" cy="412" r="6" fill="#059669"/><circle cx="150" cy="436" r="6" fill="#059669"/>
<text x="176" y="392" class="monos">reaches</text><text x="176" y="416" class="monos">reaches</text><text x="176" y="440" class="monos">reaches</text>

<!-- ============ STEP 2 · EXPECT ============ -->
<g filter="url(#sh)"><rect x="326" y="120" width="264" height="420" rx="14" fill="#F5F3FF" stroke="#A78BFA" stroke-width="2"/></g>
<circle cx="352" cy="148" r="13" fill="#7C3AED"/><text x="352" y="153" text-anchor="middle" class="badge">2</text>
<text x="374" y="153" class="st" fill="#5B21B6">EXPECT</text>
<text x="346" y="184" class="p">Record one pending row per</text>
<text x="346" y="201" class="p">neighbor — all share this ts,</text>
<text x="346" y="218" class="p">each keyed by its own MAC.</text>
<text x="346" y="248" class="mono" fill="#5B21B6">pending_add(mac, ts, now)</text>
<!-- table -->
<rect x="346" y="266" width="224" height="30" rx="6" fill="#EDE9FE"/>
<text x="360" y="285" class="monos" fill="#5B21B6">node</text><text x="452" y="285" class="monos" fill="#5B21B6">ts</text><text x="536" y="285" class="monos" fill="#5B21B6">ack?</text>
<text x="360" y="322" class="mono">N1</text><text x="452" y="322" class="mono">18420</text><circle cx="544" cy="318" r="7" fill="#FFF" stroke="#94A3B8" stroke-width="2"/>
<text x="360" y="352" class="mono">N2</text><text x="452" y="352" class="mono">18420</text><circle cx="544" cy="348" r="7" fill="#FFF" stroke="#94A3B8" stroke-width="2"/>
<text x="360" y="382" class="mono">N3</text><text x="452" y="382" class="mono">18420</text><circle cx="544" cy="378" r="7" fill="#FFF" stroke="#94A3B8" stroke-width="2"/>
<text x="346" y="420" class="monos" fill="#94A3B8">○ = waiting for ACK</text>
<text x="346" y="452" class="p">The table now holds 3 open</text>
<text x="346" y="469" class="p">expectations for ts 18420.</text>

<!-- ============ STEP 3 · MATCH ============ -->
<g filter="url(#sh)"><rect x="620" y="120" width="264" height="420" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="2"/></g>
<circle cx="646" cy="148" r="13" fill="#2563EB"/><text x="646" y="153" text-anchor="middle" class="badge">3</text>
<text x="668" y="153" class="st" fill="#1D4ED8">MATCH</text>
<text x="640" y="184" class="p">Each ACK echoes the ts back.</text>
<text x="640" y="201" class="p">Find the row with the same</text>
<text x="640" y="218" class="p">MAC + ts and tick it.</text>
<text x="640" y="248" class="mono" fill="#1D4ED8">pending_match(mac, ts)</text>
<!-- acks arriving -->
<rect x="640" y="266" width="224" height="26" rx="6" fill="#DBEAFE"/>
<text x="654" y="284" class="mono" fill="#1D4ED8">ACK from N1 { 18420 }</text>
<rect x="640" y="298" width="224" height="26" rx="6" fill="#DBEAFE"/>
<text x="654" y="316" class="mono" fill="#1D4ED8">ACK from N2 { 18420 }</text>
<rect x="640" y="330" width="224" height="26" rx="6" fill="#FEE2E2" stroke="#FCA5A5" stroke-width="1"/>
<text x="654" y="348" class="mono" fill="#991B1B">N3 ACK — never arrives</text>
<!-- table state -->
<text x="640" y="384" class="monos" fill="#64748B">table after matching:</text>
<text x="654" y="410" class="mono">N1</text><circle cx="712" cy="406" r="7" fill="#059669"/><path d="M708.8,406 l2.2,2.2 l4.2,-4.4" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="740" y="410" class="mono">N2</text><circle cx="798" cy="406" r="7" fill="#059669"/><path d="M794.8,406 l2.2,2.2 l4.2,-4.4" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="654" y="440" class="mono">N3</text><circle cx="712" cy="436" r="7" fill="#FFF" stroke="#94A3B8" stroke-width="2"/><text x="726" y="440" class="monos" fill="#94A3B8">still waiting</text>

<!-- ============ STEP 4 · REAP ============ -->
<g filter="url(#sh)"><rect x="914" y="120" width="264" height="420" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="2"/></g>
<circle cx="940" cy="148" r="13" fill="#B45309"/><text x="940" y="153" text-anchor="middle" class="badge">4</text>
<text x="962" y="153" class="st" fill="#92400E">SCORE</text>
<text x="934" y="184" class="p">Each cycle, close out the rows:</text>
<text x="934" y="201" class="p">acked = hit (1); waited past</text>
<text x="934" y="218" class="p">1 s with no ACK = loss (0).</text>
<text x="934" y="248" class="mono" fill="#92400E">pending_reap(now)</text>
<!-- outcomes -->
<text x="934" y="286" class="mono">N1  ✓ acked</text><rect x="1092" y="272" width="30" height="24" rx="5" fill="#DCFCE7" stroke="#059669"/><text x="1107" y="289" text-anchor="middle" class="mono" fill="#065F46" font-weight="700">1</text>
<text x="934" y="322" class="mono">N2  ✓ acked</text><rect x="1092" y="308" width="30" height="24" rx="5" fill="#DCFCE7" stroke="#059669"/><text x="1107" y="325" text-anchor="middle" class="mono" fill="#065F46" font-weight="700">1</text>
<text x="934" y="358" class="mono" fill="#991B1B">N3  ✗ timeout</text><rect x="1092" y="344" width="30" height="24" rx="5" fill="#FEE2E2" stroke="#DC2626"/><text x="1107" y="361" text-anchor="middle" class="mono" fill="#991B1B" font-weight="700">0</text>
<line x1="934" y1="382" x2="1154" y2="382" stroke="#FDE68A" stroke-width="1.4"/>
<text x="934" y="410" class="p">Push each outcome into the</text>
<text x="934" y="427" class="p">rolling window of the last 100.</text>
<text x="934" y="462" class="monos" fill="#92400E">s_results[…] ← 1, 1, 0</text>

<!-- ============ STEP 5 · RATIO ============ -->
<g filter="url(#sh)"><rect x="1208" y="120" width="176" height="420" rx="14" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/></g>
<circle cx="1234" cy="148" r="13" fill="#475569"/><text x="1234" y="153" text-anchor="middle" class="badge">5</text>
<text x="1256" y="153" class="st">RATIO</text>
<text x="1228" y="184" class="p">Over the last 100</text>
<text x="1228" y="201" class="p">outcomes:</text>
<!-- window strip -->
<g font-family="ui-monospace,Menlo,monospace" font-size="12" font-weight="700">
<rect x="1228" y="220" width="20" height="20" rx="3" fill="#DCFCE7" stroke="#059669"/><text x="1238" y="235" text-anchor="middle" fill="#065F46">1</text>
<rect x="1250" y="220" width="20" height="20" rx="3" fill="#DCFCE7" stroke="#059669"/><text x="1260" y="235" text-anchor="middle" fill="#065F46">1</text>
<rect x="1272" y="220" width="20" height="20" rx="3" fill="#FEE2E2" stroke="#DC2626"/><text x="1282" y="235" text-anchor="middle" fill="#991B1B">0</text>
<rect x="1294" y="220" width="20" height="20" rx="3" fill="#DCFCE7" stroke="#059669"/><text x="1304" y="235" text-anchor="middle" fill="#065F46">1</text>
<rect x="1316" y="220" width="20" height="20" rx="3" fill="#DCFCE7" stroke="#059669"/><text x="1326" y="235" text-anchor="middle" fill="#065F46">1</text>
</g>
<text x="1340" y="235" class="monos">…</text>
<text x="1228" y="272" class="monos" fill="#475569">= hits ÷ total</text>
<text x="1228" y="308" class="mono" font-weight="700" fill="#059669">delivery_ratio</text>
<text x="1228" y="344" class="big" fill="#059669">0.97</text>
<text x="1228" y="386" class="mono" font-weight="700" fill="#B45309">packet_loss</text>
<text x="1228" y="422" class="big" fill="#B45309">0.03</text>
<text x="1228" y="462" class="monos" fill="#94A3B8">→ into next</text>
<text x="1228" y="478" class="monos" fill="#94A3B8">STATUS &amp; dashboard</text>

<!-- footer -->
<text x="56" y="562" class="monos" fill="#94A3B8">Matching on (MAC, ts) is what lets one broadcast be tracked as a separate hit/miss per neighbor · PENDING_MAX 64 · ACK_TIMEOUT 1 s · window 100</text>
</svg>
