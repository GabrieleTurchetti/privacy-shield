<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img">
<title>Power Consumption — Masking Off vs On</title>
<defs><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.09"/></filter></defs>
<style>
text{font-family:Inter,'Segoe UI',Helvetica,Arial,sans-serif}
.tt{font-size:27px;font-weight:800;fill:#0F172A}.sub{font-size:14px;fill:#64748B}
.th{font-size:15px;font-weight:800}
.td{font-size:14.5px;fill:#334155}
.val{font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;font-size:14px;fill:#0F172A}
.big{font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;font-size:18px;font-weight:700}
.ico{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
</style>
<rect x="0" y="0" width="1200" height="520" fill="#EEF2F7"/>
<rect x="24" y="24" width="1152" height="472" rx="20" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="56" y="70" class="tt">Power Consumption — Masking Off vs On</text>
<text x="56" y="96" class="sub">Per-component current draw and battery life on a single 1100 mAh Li-ion cell</text>

<!-- table container -->
<rect x="64" y="132" width="1072" height="336" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.6"/>
<!-- column tint bands (rows area only) -->
<rect x="500" y="186" width="318" height="282" fill="#F0FDF4"/>
<rect x="818" y="186" width="318" height="282" fill="#FFFBEB"/>
<!-- header band -->
<path d="M64,146 a14,14 0 0 1 14,-14 h1044 a14,14 0 0 1 14,14 v40 h-1072 z" fill="#F1F5F9"/>
<text x="88" y="173" class="th" fill="#0F172A">Component</text>
<circle cx="512" cy="164" r="5" fill="#059669"/><text x="526" y="173" class="th" fill="#065F46">Masking Off</text>
<circle cx="830" cy="164" r="5" fill="#B45309"/><text x="844" y="173" class="th" fill="#92400E">Masking On</text>

<!-- rows -->
<!-- ESP32 -->
<text x="88" y="222" class="td">ESP32-S3</text><text x="526" y="222" class="val">90 mA</text><text x="844" y="222" class="val">90 mA</text>
<line x1="64" y1="238" x2="1136" y2="238" stroke="#EEF2F7" stroke-width="1.4"/>
<!-- Microphone -->
<text x="88" y="272" class="td">Microphone</text><text x="526" y="272" class="val">2 mA</text><text x="844" y="272" class="val">2 mA</text>
<line x1="64" y1="288" x2="1136" y2="288" stroke="#EEF2F7" stroke-width="1.4"/>
<!-- Audio -->
<text x="88" y="322" class="td">Audio (amp + transducer)</text><text x="526" y="322" class="val">3 mA</text><text x="844" y="322" class="val" font-weight="700" fill="#B45309">150 mA</text>
<line x1="64" y1="338" x2="1136" y2="338" stroke="#E2E8F0" stroke-width="1.6"/>
<!-- Total -->
<rect x="64" y="338" width="1072" height="52" fill="#0F172A" opacity="0.03"/>
<text x="88" y="371" class="td" font-weight="800" fill="#0F172A">Total Consumption</text>
<text x="526" y="371" class="val" font-weight="700">93 mA</text>
<text x="844" y="371" class="val" font-weight="700">242 mA</text>
<line x1="64" y1="390" x2="1136" y2="390" stroke="#E2E8F0" stroke-width="1.4"/>
<!-- Lifetime -->
<g transform="translate(88,420)" stroke="#334155" class="ico"><rect x="0" y="4" width="26" height="14" rx="2"/><rect x="26" y="8" width="3" height="6" rx="1" fill="#334155" stroke="none"/></g>
<text x="126" y="434" class="td" font-weight="800" fill="#0F172A">Battery life (1100 mAh)</text>
<text x="526" y="435" class="big" fill="#059669">~11.5 hours</text>
<text x="844" y="435" class="big" fill="#B45309">~4.5 hours</text>

<!-- footnote -->
<text x="64" y="490" class="sub" fill="#94A3B8">Masking On is dominated by the Class-D amplifier driving the transducer · lifetime = 1100 mAh ÷ total current</text>
</svg>
