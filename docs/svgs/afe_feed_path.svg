<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1510 602" role="img">
<title>Audio Feed Task — audio_afe_feed()</title>
<defs><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.09"/></filter><marker id="ar" markerWidth="11" markerHeight="11" refX="7.5" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#94A3B8"/></marker></defs>
<style>text{font-family:Inter,'Segoe UI',Helvetica,Arial,sans-serif}.tt{font-size:27px;font-weight:800;fill:#0F172A}.sub{font-size:14px;fill:#64748B}.st{font-size:16px;font-weight:800}.ss{font-size:11px;font-weight:700}.p{font-size:12.5px;fill:#334155}.badge{font-size:14px;font-weight:800;fill:#fff}.mono{font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;font-size:11px;fill:#0F172A}.lbl{font-size:11px;font-weight:800}.note{font-size:11px;fill:#475569}.chip{font-size:10px;font-weight:700}.bandt{font-size:14px;font-weight:800}</style>
<rect x="0" y="0" width="1510" height="602" fill="#EEF2F7"/>
<rect x="24" y="24" width="1462" height="554" rx="20" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="56" y="70" class="tt">Audio Feed Task — audio_afe_feed()</text>
<text x="56" y="96" class="sub">Capture → interleave → feed · FreeRTOS task, one iteration per mic frame from the input queue</text>
<line x1="386" y1="293.0" x2="399" y2="293.0" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#ar)"/>
<g filter="url(#sh)"><rect x="40" y="170" width="344" height="246" rx="14" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.8"/></g>
<path d="M54,170 h316 a14,14 0 0 1 14,14 v34 h-344 v-34 a14,14 0 0 1 14,-14 z" fill="#EFF6FF"/>
<circle cx="66" cy="194" r="13" fill="#2563EB"/>
<text x="66" y="194" text-anchor="middle" dominant-baseline="central" class="badge">1</text>
<text x="88" y="194" dominant-baseline="central" class="st" fill="#2563EB">Mic frame in</text>
<text x="56" y="242" class="p">Blocking read of one raw mic</text>
<text x="56" y="259" class="p">frame captured over I2S.</text>
<rect x="56" y="286" width="312" height="78" rx="7" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1"/>
<text x="66" y="308" class="mono" fill="#2563EB">xQueueReceive(</text>
<text x="66" y="323" class="mono" fill="#2563EB">  audio_input_queue,</text>
<text x="66" y="338" class="mono" fill="#2563EB">  microphone_buffer,</text>
<text x="66" y="353" class="mono" fill="#2563EB">  portMAX_DELAY)</text>
<text x="56" y="380" class="note">int16 PCM · feed_chunksize · 1 ch</text>
<line x1="748" y1="293.0" x2="761" y2="293.0" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#ar)"/>
<g filter="url(#sh)"><rect x="402" y="170" width="344" height="246" rx="14" fill="#FFFFFF" stroke="#F9A8D4" stroke-width="1.8"/></g>
<path d="M416,170 h316 a14,14 0 0 1 14,14 v34 h-344 v-34 a14,14 0 0 1 14,-14 z" fill="#FDF2F8"/>
<circle cx="428" cy="194" r="13" fill="#DB2777"/>
<text x="428" y="194" text-anchor="middle" dominant-baseline="central" class="badge">R</text>
<text x="450" y="194" dominant-baseline="central" class="st" fill="#DB2777">Reference (far-end)</text>
<text x="418" y="242" class="p">AEC reference = the masking</text>
<text x="418" y="259" class="p">pink noise from the previous</text>
<text x="418" y="276" class="p">fetch cycle (what we play).</text>
<rect x="418" y="303" width="312" height="48" rx="7" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1"/>
<text x="428" y="325" class="mono" fill="#DB2777">speaker_buffer</text>
<text x="428" y="340" class="mono" fill="#DB2777">int16 · 1 ch</text>
<text x="418" y="367" class="note">zero-filled until the first fetch</text>
<line x1="1110" y1="293.0" x2="1123" y2="293.0" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#ar)"/>
<g filter="url(#sh)"><rect x="764" y="170" width="344" height="246" rx="14" fill="#FFFFFF" stroke="#C7D2FE" stroke-width="1.8"/></g>
<path d="M778,170 h316 a14,14 0 0 1 14,14 v34 h-344 v-34 a14,14 0 0 1 14,-14 z" fill="#EEF2FF"/>
<circle cx="790" cy="190" r="13" fill="#4F46E5"/>
<text x="790" y="190" text-anchor="middle" dominant-baseline="central" class="badge">2</text>
<text x="812" y="190" dominant-baseline="central" class="st" fill="#4F46E5">Interleave</text>
<text x="812" y="207" class="ss" fill="#4F46E5">build feed_buffer</text>
<text x="780" y="242" class="p">If an R channel exists, weave</text>
<text x="780" y="259" class="p">mic + ref into one 2-ch frame.</text>
<rect x="780" y="286" width="312" height="63" rx="7" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1"/>
<text x="790" y="308" class="mono" fill="#4F46E5">for i in 0..chunksize-1:</text>
<text x="790" y="323" class="mono" fill="#4F46E5">  feed[2i]   = mic[i]</text>
<text x="790" y="338" class="mono" fill="#4F46E5">  feed[2i+1] = spk[i]</text>
<text x="780" y="365" class="note">feed_buffer · int16 · 2 ch (MR)</text>
<text x="780" y="381" class="note">no R → feed the mic directly</text>
<g filter="url(#sh)"><rect x="1126" y="170" width="344" height="246" rx="14" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1.8"/></g>
<path d="M1140,170 h316 a14,14 0 0 1 14,14 v34 h-344 v-34 a14,14 0 0 1 14,-14 z" fill="#F5F3FF"/>
<circle cx="1152" cy="194" r="13" fill="#7C3AED"/>
<text x="1152" y="194" text-anchor="middle" dominant-baseline="central" class="badge">3</text>
<text x="1174" y="194" dominant-baseline="central" class="st" fill="#7C3AED">Feed the AFE</text>
<text x="1142" y="242" class="p">Hand the frame to ESP-SR;</text>
<text x="1142" y="259" class="p">one feed per received frame.</text>
<rect x="1142" y="286" width="312" height="48" rx="7" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1"/>
<text x="1152" y="308" class="mono" fill="#7C3AED">ret = afe_handle->feed(</text>
<text x="1152" y="323" class="mono" fill="#7C3AED">      afe_data, feed_buffer)</text>
<text x="1142" y="350" class="note">ret &lt; 0 → logged as an error</text>
<line x1="755.0" y1="418" x2="755.0" y2="432" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#ar)"/>
<g filter="url(#sh)"><rect x="40" y="434" width="1430" height="128" rx="14" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.6"/></g>
<text x="64" y="464" class="bandt" fill="#334155">Inside ESP-SR AFE — runs between feed() and fetch()</text>
<rect x="64.0" y="478" width="447" height="70" rx="9" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.3"/>
<text x="78.0" y="500" class="lbl" fill="#B45309">AEC</text>
<text x="78.0" y="518" class="note" fill="#334155">aec_init = ('R' in input_format)</text>
<text x="78.0" y="533" class="note" fill="#334155">cancels our own masking echo</text>
<rect x="531.3333333333333" y="478" width="447" height="70" rx="9" fill="#ECFEFF" stroke="#5EEAD4" stroke-width="1.3"/>
<text x="545.3333333333333" y="500" class="lbl" fill="#0D9488">NS</text>
<text x="545.3333333333333" y="518" class="note" fill="#334155">ns_init = true</text>
<text x="545.3333333333333" y="533" class="note" fill="#334155">suppresses background noise</text>
<rect x="998.6666666666666" y="478" width="447" height="70" rx="9" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.3"/>
<text x="1012.6666666666666" y="500" class="lbl" fill="#2563EB">VAD</text>
<text x="1012.6666666666666" y="518" class="note" fill="#334155">VAD_MODE_1 · min_noise 500 ms</text>
<text x="1012.6666666666666" y="533" class="note" fill="#334155">min_speech 200 ms · delay 128 ms</text>
</svg>