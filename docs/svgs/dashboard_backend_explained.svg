<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 744" role="img">
<title>Dashboard &amp; Backend Architecture</title>
<defs>
<filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.09"/></filter>
<marker id="mb" markerWidth="11" markerHeight="11" refX="7.5" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#2563EB"/></marker>
<marker id="mg" markerWidth="11" markerHeight="11" refX="7.5" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#059669"/></marker>
<marker id="mt" markerWidth="11" markerHeight="11" refX="7.5" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#0D9488"/></marker>
<marker id="mv" markerWidth="11" markerHeight="11" refX="7.5" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#7C3AED"/></marker>
</defs>
<style>
text{font-family:Inter,'Segoe UI',Helvetica,Arial,sans-serif}
.tt{font-size:29px;font-weight:800;fill:#0F172A}.sub{font-size:14.5px;fill:#64748B}
.h{font-size:16px;font-weight:800;fill:#0F172A}.sh{font-size:14px;font-weight:800;fill:#0F172A}
.p{font-size:12.5px;fill:#475569}.lab{font-size:12px;font-weight:700}
.monos{font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;font-size:11px;fill:#94A3B8}
.ico{fill:none;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
</style>
<rect x="0" y="0" width="1400" height="744" fill="#EEF2F7"/>
<rect x="24" y="24" width="1352" height="696" rx="20" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="56" y="70" class="tt">Dashboard &amp; Backend</text>
<text x="56" y="96" class="sub">Browser ↔ HTTP/REST ↔ ESP32-S3 Hub (Wi-Fi AP + ESP-NOW) ↔ masking nodes · no cloud, no app</text>

<!-- ===== CLIENT ===== -->
<g filter="url(#sh)"><rect x="80" y="120" width="1240" height="128" rx="16" fill="#EFF6FF" stroke="#93C5FD" stroke-width="2"/></g>
<rect x="80" y="120" width="1240" height="36" rx="16" fill="#DBEAFE"/>
<g transform="translate(108,130)" stroke="#1D4ED8" class="ico"><rect x="0" y="0" width="30" height="19" rx="3"/><path d="M-4,25 L34,25 L30,19 L0,19 Z"/></g>
<text x="150" y="138" dominant-baseline="central" class="h" fill="#1D4ED8">CLIENT · Browser Dashboard</text>
<text x="112" y="188" class="p">A plain web page the hub serves itself. It polls the hub every ~2 seconds to show each node's masking</text>
<text x="112" y="208" class="p">state, volume, battery and link health, and turns button presses (mute / volume / reboot) into HTTP</text>
<text x="112" y="228" class="p">requests. It runs in any browser on the hub's Wi-Fi — there is nothing to install.</text>

<!-- link client<->hub -->
<path d="M470,248 L470,320" fill="none" stroke="#2563EB" stroke-width="2.6" marker-end="url(#mb)"/>
<text x="486" y="280" class="lab" fill="#2563EB">HTTP POST ↓</text>
<text x="486" y="296" class="monos" fill="#94A3B8">commands</text>
<path d="M940,320 L940,248" fill="none" stroke="#059669" stroke-width="2.6" marker-end="url(#mg)"/>
<text x="924" y="280" text-anchor="end" class="lab" fill="#059669">↑ HTTP GET</text>
<text x="924" y="296" text-anchor="end" class="monos" fill="#94A3B8">/api/nodes (JSON)</text>
<text x="705" y="288" text-anchor="middle" class="monos">Wi-Fi SoftAP · http://192.168.4.1</text>

<!-- ===== HUB ===== -->
<g filter="url(#sh)"><rect x="80" y="320" width="1240" height="232" rx="16" fill="#F5F3FF" stroke="#A78BFA" stroke-width="2"/></g>
<rect x="80" y="320" width="1240" height="38" rx="16" fill="#EDE9FE"/>
<g transform="translate(109,327)" stroke="#5B21B6" class="ico"><path d="M0,16 a15.5,15.5 0 0 1 27,0"/><path d="M5.5,21.5 a9,9 0 0 1 16,0"/><circle cx="13.5" cy="26.5" r="2.4" fill="#5B21B6" stroke="none"/></g>
<text x="150" y="339" dominant-baseline="central" class="h" fill="#5B21B6">ESP32-S3 HUB — backend (Wi-Fi AP + ESP-NOW, FreeRTOS)</text>

<!-- web_server -->
<rect x="104" y="378" width="376" height="150" rx="12" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1.6"/>
<text x="124" y="406" class="sh" fill="#5B21B6">web_server.c</text>
<text x="124" y="432" class="p">The HTTP server. It listens on the</text>
<text x="124" y="452" class="p">hub's Wi-Fi access point, serves the</text>
<text x="124" y="472" class="p">dashboard page, and routes every</text>
<text x="124" y="492" class="p">/api/… request to the right handler.</text>

<!-- web_api -->
<rect x="512" y="378" width="376" height="150" rx="12" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1.6"/>
<text x="532" y="406" class="sh" fill="#5B21B6">web_api.c</text>
<text x="532" y="432" class="p">The application logic. It turns</text>
<text x="532" y="452" class="p">dashboard actions into mesh</text>
<text x="532" y="472" class="p">commands, caches each node's latest</text>
<text x="532" y="492" class="p">status, and answers with JSON.</text>

<!-- mesh_core -->
<rect x="920" y="378" width="376" height="150" rx="12" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1.6"/>
<text x="940" y="406" class="sh" fill="#5B21B6">mesh_core</text>
<text x="940" y="432" class="p">The radio layer. It sends a command to</text>
<text x="940" y="452" class="p">one node over ESP-NOW and receives</text>
<text x="940" y="472" class="p">status + health from every node,</text>
<text x="940" y="492" class="p">tracking which ones are online.</text>

<!-- internal arrows -->
<path d="M480,453 L512,453" fill="none" stroke="#7C3AED" stroke-width="2" marker-end="url(#mv)"/>
<path d="M888,453 L920,453" fill="none" stroke="#7C3AED" stroke-width="2" marker-end="url(#mv)"/>

<!-- link hub<->nodes -->
<path d="M470,552 L470,606" fill="none" stroke="#0D9488" stroke-width="2.6" stroke-dasharray="7 5" marker-end="url(#mt)"/>
<text x="486" y="580" class="lab" fill="#0D9488">ESP-NOW ↓</text>
<text x="486" y="596" class="monos" fill="#94A3B8">COMMAND (unicast)</text>
<path d="M940,606 L940,552" fill="none" stroke="#0D9488" stroke-width="2.6" stroke-dasharray="7 5" marker-end="url(#mt)"/>
<text x="924" y="580" text-anchor="end" class="lab" fill="#0D9488">↑ ESP-NOW</text>
<text x="924" y="596" text-anchor="end" class="monos" fill="#94A3B8">STATUS (broadcast) + ACK</text>

<!-- ===== NODES ===== -->
<g filter="url(#sh)"><rect x="330" y="610" width="240" height="98" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="2"/></g>
<g transform="translate(352,630)" stroke="#059669" class="ico"><rect x="0" y="4" width="20" height="20" rx="4"/><line x1="5" y1="0" x2="5" y2="4"/><line x1="10" y1="0" x2="10" y2="4"/><line x1="15" y1="0" x2="15" y2="4"/><line x1="5" y1="24" x2="5" y2="28"/><line x1="10" y1="24" x2="10" y2="28"/><line x1="15" y1="24" x2="15" y2="28"/><circle cx="10" cy="14" r="3.6"/></g>
<text x="384" y="644" dominant-baseline="central" class="sh" fill="#065F46">Masking Node</text>
<text x="352" y="676" class="p">Obeys mute / volume / reboot</text>
<text x="352" y="695" class="p">and reports its status on a timer.</text>

<g filter="url(#sh)"><rect x="600" y="610" width="240" height="98" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="2"/></g>
<g transform="translate(622,630)" stroke="#059669" class="ico"><rect x="0" y="4" width="20" height="20" rx="4"/><line x1="5" y1="0" x2="5" y2="4"/><line x1="10" y1="0" x2="10" y2="4"/><line x1="15" y1="0" x2="15" y2="4"/><line x1="5" y1="24" x2="5" y2="28"/><line x1="10" y1="24" x2="10" y2="28"/><line x1="15" y1="24" x2="15" y2="28"/><circle cx="10" cy="14" r="3.6"/></g>
<text x="654" y="644" dominant-baseline="central" class="sh" fill="#065F46">Masking Node</text>
<text x="622" y="676" class="p">Obeys mute / volume / reboot</text>
<text x="622" y="695" class="p">and reports its status on a timer.</text>

<g filter="url(#sh)"><rect x="870" y="610" width="240" height="98" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="2"/></g>
<g transform="translate(892,630)" stroke="#059669" class="ico"><rect x="0" y="4" width="20" height="20" rx="4"/><line x1="5" y1="0" x2="5" y2="4"/><line x1="10" y1="0" x2="10" y2="4"/><line x1="15" y1="0" x2="15" y2="4"/><line x1="5" y1="24" x2="5" y2="28"/><line x1="10" y1="24" x2="10" y2="28"/><line x1="15" y1="24" x2="15" y2="28"/><circle cx="10" cy="14" r="3.6"/></g>
<text x="924" y="644" dominant-baseline="central" class="sh" fill="#065F46">Masking Node</text>
<text x="892" y="676" class="p">Obeys mute / volume / reboot</text>
<text x="892" y="695" class="p">and reports its status on a timer.</text>
</svg>
