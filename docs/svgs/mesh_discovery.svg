<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 600" role="img">
<title>Node Discovery — HELLO &amp; Neighbor Table</title>
<defs><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.09"/></filter><marker id="ar_blue" markerWidth="11" markerHeight="11" refX="7.5" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#2563EB"/></marker><marker id="ar_green" markerWidth="11" markerHeight="11" refX="7.5" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#059669"/></marker><marker id="ar_violet" markerWidth="11" markerHeight="11" refX="7.5" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#7C3AED"/></marker><marker id="ar_amber" markerWidth="11" markerHeight="11" refX="7.5" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#B45309"/></marker><marker id="ar_slate" markerWidth="11" markerHeight="11" refX="7.5" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#475569"/></marker><marker id="ar_teal" markerWidth="11" markerHeight="11" refX="7.5" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#0D9488"/></marker></defs>
<style>text{font-family:Inter,'Segoe UI',Helvetica,Arial,sans-serif}.tt{font-size:29px;font-weight:800;fill:#0F172A}.sub{font-size:14.5px;fill:#64748B}.h{font-size:16px;font-weight:700;fill:#0F172A}.s{font-size:12.5px;fill:#64748B}.lab{font-size:12px;font-weight:700}.num{font-size:19px;font-weight:800}.mono{font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;font-size:12px;fill:#0F172A}.monos{font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;font-size:11px;fill:#64748B}.tag{font-size:10.5px;font-weight:700}.ico{fill:none;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}</style>
<rect x="0" y="0" width="1360" height="600" fill="#EEF2F7"/>
<rect x="24" y="24" width="1312" height="552" rx="20" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="56" y="74" class="tt">Node Discovery — HELLO &amp; Neighbor Table</text>
<text x="56" y="100" class="sub">Each node broadcasts HELLO every 3 s; neighbors are learned automatically and pruned after 30 s of silence</text>
<g filter="url(#sh)"><rect x="120" y="150" width="150" height="58" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="2"/></g>
<g transform="translate(140,163)" stroke="#059669" class="ico"><rect x="0" y="4" width="26" height="26" rx="4"/><line x1="6" y1="0" x2="6" y2="4"/><line x1="13" y1="0" x2="13" y2="4"/><line x1="20" y1="0" x2="20" y2="4"/><line x1="6" y1="30" x2="6" y2="34"/><line x1="13" y1="30" x2="13" y2="34"/><line x1="20" y1="30" x2="20" y2="34"/><circle cx="13" cy="17" r="5"/></g>
<text x="180" y="185" class="h" fill="#065F46">Node 1</text>
<line x1="195" y1="208" x2="195" y2="386" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="4 5"/>
<g filter="url(#sh)"><rect x="560" y="150" width="150" height="58" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="2"/></g>
<g transform="translate(580,163)" stroke="#2563EB" class="ico"><rect x="0" y="4" width="26" height="26" rx="4"/><line x1="6" y1="0" x2="6" y2="4"/><line x1="13" y1="0" x2="13" y2="4"/><line x1="20" y1="0" x2="20" y2="4"/><line x1="6" y1="30" x2="6" y2="34"/><line x1="13" y1="30" x2="13" y2="34"/><line x1="20" y1="30" x2="20" y2="34"/><circle cx="13" cy="17" r="5"/></g>
<text x="620" y="185" class="h" fill="#1D4ED8">Node 2</text>
<line x1="635" y1="208" x2="635" y2="386" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="4 5"/>
<text x="205" y="258" class="s" font-weight="700" fill="#475569">hello_task · broadcast every 3 s</text>
<path d="M195,292 L637,292" fill="none" stroke="#059669" stroke-width="2.2" marker-end="url(#ar_green)"/>
<rect x="305" y="280" width="220" height="24" rx="6" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.3"/>
<text x="415" y="296" text-anchor="middle" class="mono" fill="#065F46">HELLO { src_id = 1 }</text>
<path d="M635,356 L193,356" fill="none" stroke="#2563EB" stroke-width="2.2" marker-end="url(#ar_blue)"/>
<rect x="305" y="344" width="220" height="24" rx="6" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.3"/>
<text x="415" y="360" text-anchor="middle" class="mono" fill="#1D4ED8">HELLO { src_id = 2 }</text>
<g transform="translate(140,418)" stroke="#B45309" class="ico"><circle cx="12" cy="12" r="11"/><line x1="12" y1="6" x2="12" y2="12"/><line x1="12" y1="12" x2="17" y2="15"/></g>
<text x="176" y="428" class="lab" fill="#92400E">prune_task · every 10 s</text>
<text x="176" y="448" class="s">removes any neighbor not heard within 30 s (MESH_NEIGHBOR_TIMEOUT_MS)</text>
<g filter="url(#sh)"><rect x="770" y="150" width="510" height="330" rx="14" fill="#F5F3FF" stroke="#A78BFA" stroke-width="2"/></g>
<text x="796" y="184" class="h" fill="#5B21B6">Neighbor Table</text>
<text x="796" y="204" class="s">updated by mesh_discovery_heard() on every received packet</text>
<rect x="786" y="222" width="478" height="32" rx="6" fill="#EDE9FE"/>
<text x="796" y="243" class="tag" fill="#5B21B6">MAC</text>
<text x="1070" y="243" class="tag" fill="#5B21B6">node_id</text>
<text x="1150" y="243" class="tag" fill="#5B21B6">last_heard</text>
<text x="796" y="294" class="mono" fill="#0F172A">a4:cf:12:aa:00:02</text>
<text x="1078" y="294" class="mono">2</text>
<text x="1150" y="294" class="mono" fill="#0F172A">just now</text>
<line x1="786" y1="306" x2="1264" y2="306" stroke="#EDE9FE" stroke-width="1.2"/>
<text x="796" y="334" class="mono" fill="#0F172A">a4:cf:12:aa:00:03</text>
<text x="1078" y="334" class="mono">3</text>
<text x="1150" y="334" class="mono" fill="#0F172A">4 s ago</text>
<line x1="786" y1="346" x2="1264" y2="346" stroke="#EDE9FE" stroke-width="1.2"/>
<text x="796" y="374" class="mono" fill="#0F172A">a4:cf:12:aa:00:07</text>
<text x="1078" y="374" class="mono">7</text>
<text x="1150" y="374" class="mono" fill="#DC2626">31 s → pruned</text>
<line x1="786" y1="386" x2="1264" y2="386" stroke="#EDE9FE" stroke-width="1.2"/>
<rect x="790" y="440" width="146" height="30" rx="15" fill="#EDE9FE" stroke="#A78BFA" stroke-width="1.1"/>
<text x="863" y="460" text-anchor="middle" class="s" font-weight="600" fill="#5B21B6">auto-discovery</text>
<rect x="952" y="440" width="126" height="30" rx="15" fill="#EDE9FE" stroke="#A78BFA" stroke-width="1.1"/>
<text x="1015" y="460" text-anchor="middle" class="s" font-weight="600" fill="#5B21B6">auto-prune</text>
<rect x="1094" y="440" width="164" height="30" rx="15" fill="#EDE9FE" stroke="#A78BFA" stroke-width="1.1"/>
<text x="1176" y="460" text-anchor="middle" class="s" font-weight="600" fill="#5B21B6">max 16 neighbors</text>
</svg>