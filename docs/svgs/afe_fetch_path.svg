<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1872 510" role="img">
<title>Audio Fetch Task — audio_afe_fetch()</title>
<defs><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.09"/></filter><marker id="ar" markerWidth="11" markerHeight="11" refX="7.5" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#94A3B8"/></marker></defs>
<style>text{font-family:Inter,'Segoe UI',Helvetica,Arial,sans-serif}.tt{font-size:27px;font-weight:800;fill:#0F172A}.sub{font-size:14px;fill:#64748B}.st{font-size:16px;font-weight:800}.ss{font-size:11px;font-weight:700}.p{font-size:12.5px;fill:#334155}.badge{font-size:14px;font-weight:800;fill:#fff}.mono{font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;font-size:11px;fill:#0F172A}.lbl{font-size:11px;font-weight:800}.note{font-size:11px;fill:#475569}.chip{font-size:10px;font-weight:700}.bandt{font-size:14px;font-weight:800}</style>
<rect x="0" y="0" width="1872" height="510" fill="#EEF2F7"/>
<rect x="24" y="24" width="1824" height="462" rx="20" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="56" y="70" class="tt">Audio Fetch Task — audio_afe_fetch()</text>
<text x="56" y="96" class="sub">Fetch → VAD → generate pink noise → adaptive masking → output · the masking noise loops back as the AEC reference</text>
<line x1="386" y1="320.0" x2="399" y2="320.0" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#ar)"/>
<g filter="url(#sh)"><rect x="40" y="170" width="344" height="300" rx="14" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.8"/></g>
<path d="M54,170 h316 a14,14 0 0 1 14,14 v34 h-344 v-34 a14,14 0 0 1 14,-14 z" fill="#EFF6FF"/>
<circle cx="66" cy="194" r="13" fill="#2563EB"/>
<text x="66" y="194" text-anchor="middle" dominant-baseline="central" class="badge">1</text>
<text x="88" y="194" dominant-baseline="central" class="st" fill="#2563EB">Fetch result</text>
<text x="56" y="242" class="p">Pull one processed frame back</text>
<text x="56" y="259" class="p">out of the AFE.</text>
<rect x="56" y="286" width="312" height="93" rx="7" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1"/>
<text x="66" y="308" class="mono" fill="#2563EB">result =</text>
<text x="66" y="323" class="mono" fill="#2563EB">  afe_handle->fetch(afe_data)</text>
<text x="66" y="338" class="mono" fill="#2563EB">result->data (int16, 1 ch)</text>
<text x="66" y="353" class="mono" fill="#2563EB">result->vad_state</text>
<text x="66" y="368" class="mono" fill="#2563EB">result->ret_value</text>
<text x="56" y="395" class="note">echo-cancelled + noise-suppressed</text>
<line x1="748" y1="320.0" x2="761" y2="320.0" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#ar)"/>
<g filter="url(#sh)"><rect x="402" y="170" width="344" height="300" rx="14" fill="#FFFFFF" stroke="#5EEAD4" stroke-width="1.8"/></g>
<path d="M416,170 h316 a14,14 0 0 1 14,14 v34 h-344 v-34 a14,14 0 0 1 14,-14 z" fill="#ECFEFF"/>
<circle cx="428" cy="194" r="13" fill="#0D9488"/>
<text x="428" y="194" text-anchor="middle" dominant-baseline="central" class="badge">2</text>
<text x="450" y="194" dominant-baseline="central" class="st" fill="#0D9488">VAD state</text>
<text x="418" y="242" class="p">Map the AFE's VAD flag; log</text>
<text x="418" y="259" class="p">only when it changes.</text>
<rect x="418" y="286" width="312" height="48" rx="7" fill="#ECFEFF" stroke="#5EEAD4" stroke-width="1"/>
<text x="428" y="308" class="mono" fill="#0D9488">state = convert_vad_state(</text>
<text x="428" y="323" class="mono" fill="#0D9488">        result->vad_state)</text>
<rect x="418" y="338" width="61" height="21" rx="10" fill="#ECFEFF" stroke="#5EEAD4" stroke-width="1"/>
<text x="449" y="353" text-anchor="middle" class="chip" fill="#0D9488">SPEECH</text>
<rect x="487.2" y="338" width="68" height="21" rx="10" fill="#ECFEFF" stroke="#5EEAD4" stroke-width="1"/>
<text x="521" y="353" text-anchor="middle" class="chip" fill="#0D9488">SILENCE</text>
<rect x="563.6" y="338" width="68" height="21" rx="10" fill="#ECFEFF" stroke="#5EEAD4" stroke-width="1"/>
<text x="598" y="353" text-anchor="middle" class="chip" fill="#0D9488">UNKNOWN</text>
<line x1="1110" y1="320.0" x2="1123" y2="320.0" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#ar)"/>
<g filter="url(#sh)"><rect x="764" y="170" width="344" height="300" rx="14" fill="#FFFFFF" stroke="#F9A8D4" stroke-width="1.8"/></g>
<path d="M778,170 h316 a14,14 0 0 1 14,14 v34 h-344 v-34 a14,14 0 0 1 14,-14 z" fill="#FDF2F8"/>
<circle cx="790" cy="194" r="13" fill="#DB2777"/>
<text x="790" y="194" text-anchor="middle" dominant-baseline="central" class="badge">3</text>
<text x="812" y="194" dominant-baseline="central" class="st" fill="#DB2777">Pink noise</text>
<text x="780" y="242" class="p">Refill the output buffer with</text>
<text x="780" y="259" class="p">fresh pink noise.</text>
<rect x="780" y="286" width="312" height="48" rx="7" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1"/>
<text x="790" y="308" class="mono" fill="#DB2777">noise_gen_fill(speaker_buffer,</text>
<text x="790" y="323" class="mono" fill="#DB2777">               feed_chunksize)</text>
<text x="780" y="350" class="note">NOISE_TYPE_PINK (pre-initialised)</text>
<line x1="1472" y1="320.0" x2="1485" y2="320.0" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#ar)"/>
<g filter="url(#sh)"><rect x="1126" y="170" width="344" height="300" rx="14" fill="#FFFFFF" stroke="#F9A8D4" stroke-width="1.8"/></g>
<path d="M1140,170 h316 a14,14 0 0 1 14,14 v34 h-344 v-34 a14,14 0 0 1 14,-14 z" fill="#FDF2F8"/>
<circle cx="1152" cy="190" r="13" fill="#DB2777"/>
<text x="1152" y="190" text-anchor="middle" dominant-baseline="central" class="badge">4</text>
<text x="1174" y="190" dominant-baseline="central" class="st" fill="#DB2777">Volume &amp; masking</text>
<text x="1174" y="207" class="ss" fill="#DB2777">volume.c</text>
<text x="1142" y="242" class="p">Scale the noise by speech</text>
<text x="1142" y="259" class="p">energy — only while speaking.</text>
<rect x="1142" y="286" width="312" height="48" rx="7" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1"/>
<text x="1152" y="308" class="mono" fill="#DB2777">vol = volume_process_frame(</text>
<text x="1152" y="323" class="mono" fill="#DB2777">  vol, mic, spk, n, &amp;mask, sp)</text>
<rect x="1142" y="350" width="312" height="98" rx="7" fill="#FFFFFF" stroke="#F9A8D4" stroke-width="1.2"/>
<text x="1152" y="372" class="note" fill="#334155">silence → target 0 (no masking)</text>
<text x="1152" y="388" class="note" fill="#334155">speech → RMS → volume</text>
<text x="1152" y="404" class="note" fill="#334155">command → mute / set level</text>
<text x="1152" y="420" class="note" fill="#334155">attack 10 ms · release 100 ms</text>
<text x="1152" y="436" class="note" fill="#334155">masking active = level > 5 %</text>
<g filter="url(#sh)"><rect x="1488" y="170" width="344" height="300" rx="14" fill="#FFFFFF" stroke="#FCD34D" stroke-width="1.8"/></g>
<path d="M1502,170 h316 a14,14 0 0 1 14,14 v34 h-344 v-34 a14,14 0 0 1 14,-14 z" fill="#FFFBEB"/>
<circle cx="1514" cy="194" r="13" fill="#B45309"/>
<text x="1514" y="194" text-anchor="middle" dominant-baseline="central" class="badge">5</text>
<text x="1536" y="194" dominant-baseline="central" class="st" fill="#B45309">Output queue</text>
<text x="1504" y="242" class="p">Enqueue the masked noise for</text>
<text x="1504" y="259" class="p">the transducer.</text>
<rect x="1504" y="286" width="312" height="63" rx="7" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1"/>
<text x="1514" y="308" class="mono" fill="#B45309">xQueueSend(</text>
<text x="1514" y="323" class="mono" fill="#B45309">  audio_output_queue,</text>
<text x="1514" y="338" class="mono" fill="#B45309">  speaker_buffer, portMAX_DELAY)</text>
<rect x="1504" y="365" width="312" height="66" rx="7" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1.4"/>
<text x="1514" y="387" class="note" fill="#9D174D" font-weight="700">Played on the transducer AND</text>
<text x="1514" y="403" class="note" fill="#9D174D" font-weight="700">becomes the next frame's</text>
<text x="1514" y="419" class="note" fill="#9D174D" font-weight="700">AEC reference (R).</text>
</svg>